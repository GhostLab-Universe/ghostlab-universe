# Checks only. Nothing here releases, merges, tags, or uses a credential or a live provider.
# Actions are pinned to the commits of the tags in their comments.
name: ci

on:
  pull_request:
  push:
    branches: [main, architecture-and-refund-core]

permissions:
  contents: read

env:
  LANGSMITH_TRACING: "false"
  PYTHONUTF8: "1"

jobs:
  core-bare:
    name: Core tests, bare interpreter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install
      - name: Unit tests with no installed packages
        env:
          PYTHONPATH: src
        run: uv run --no-project --isolated python -s -m unittest discover -s tests

  python:
    name: Lock, tests and contract drift
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv lock --check
      - run: uv sync --locked --all-extras --group dev
      - name: Full suite; warnings are errors (pyproject.toml)
        run: uv run --frozen pytest
      - run: uv run --frozen python -m ghostlab.contracts.export --check

  demos:
    name: Refund and journey demo and replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen --no-dev python -m ghostlab demo
      - run: uv run --frozen --no-dev python -m ghostlab replay artifacts/local/refund-failure.json
      - run: uv run --frozen --no-dev python -m ghostlab journey-demo
      - run: uv run --frozen --no-dev python -m ghostlab journey-replay artifacts/local/journey-failure.json

  contracts-ts:
    name: TypeScript contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm --prefix web ci
      - run: npm --prefix web run contracts:verify
      - run: npm --prefix web run contracts:typecheck

  evaluations:
    name: Independent evaluations and regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked --all-extras --group dev
      - name: Run the cases; any failure or drift exits 1
        run: uv run --frozen python -m evals.run --out "$RUNNER_TEMP/evals"
      - name: Keep the evidence for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-evidence
          path: ${{ runner.temp }}/evals
          if-no-files-found: error
          retention-days: 30

  promotion-gate:
    name: Promotion gate
    if: always()
    needs: [core-bare, python, demos, contracts-ts, evaluations]
    runs-on: ubuntu-latest
    steps:
      - name: Every check must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
