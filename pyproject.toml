[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostlab-universe"
version = "0.1.0"
description = "Stateful agent failure experiments and recorded replay"
# Only the 3.13 line is locked and tested. The simulation core itself remains
# standard-library only and still runs from src/ on older interpreters.
requires-python = ">=3.13,<3.14"
# The simulation engine, verifier and capsule replay stay dependency-free.
dependencies = []

# Phase-A candidate set from docs/handoffs/versions.md, installed and tested
# together. Request changes through M00; see docs/modules/M00.md.
[project.optional-dependencies]
contracts = ["pydantic==2.14.1"]
service = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]
orchestration = [
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[project.scripts]
ghostlab = "ghostlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# uv 0.8.x cannot install CPython 3.13.18 on Windows; 0.13.6 produced uv.lock.
required-version = ">=0.13.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Serializer warnings (e.g. from frozen collections) must fail the suite.
filterwarnings = ["error"]
