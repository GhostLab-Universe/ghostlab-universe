[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostlab-universe"
version = "0.1.0"
description = "Stateful agent failure experiments and recorded replay"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ghostlab = "ghostlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
